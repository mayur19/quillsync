openapi: 3.1.0
info:
  title: quillsync API
  version: 1.0.0
  summary: HTTP and WebSocket API of the quillsync collaborative document editor.
  description: |
    Full target API of quillsync. Every operation carries `x-status`:

    - `implemented` — merged, tested, running in CI.
    - `pending` — the route is registered but returns `501 NOT_IMPLEMENTED` with the
      ticket ID in `error.details.ticket`; `x-ticket` names the backlog ticket
      (see docs/planning/backlog.md). The request/response schemas of pending
      operations are the agreed contract for that ticket.

    All JSON responses use the envelope `{ data, error, meta? }` (see `Envelope`).
    Authentication is a session cookie (`qs_session`); mutating requests made with
    a session must also send the CSRF token in `x-csrf-token` (double-submit with
    the `qs_csrf` cookie). Conventions, the error code table and the WebSocket
    walkthrough are in docs/api/README.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:4104
    description: Local API (run.sh dev)
  - url: http://localhost:5104
    description: Local web dev server; proxies /api (including WebSocket upgrades) to the API
tags:
  - name: system
    description: Liveness, readiness and metrics
  - name: auth
    description: Registration, login, sessions, password reset
  - name: documents
    description: Document metadata, materialized text, lifecycle
  - name: collaboration
    description: WebSocket sync and presence
  - name: folders
    description: Folder hierarchy (QS-090)
  - name: members
    description: Organization membership and invitations
  - name: sharing
    description: Per-document permissions and share links
  - name: versions
    description: Snapshots and version history
  - name: comments
    description: Anchored comment threads
  - name: notifications
    description: In-app notification center
  - name: search
    description: Full-text search
  - name: import-export
    description: Markdown/HTML export and Markdown import
  - name: audit
    description: Audit log query

security:
  - sessionCookie: []

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      description: Returns 200 while the process is serving requests. Does not touch the database.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/Internal'

  /api/ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: Returns 200 when the PostgreSQL pool can execute a query; 503 with error code `UNAVAILABLE` otherwise.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/metrics:
    get:
      operationId: getMetrics
      tags: [system]
      summary: Prometheus metrics
      description: Prometheus text exposition (rooms, sockets, ops/s, persist latency). Intended to be reachable only from the host or monitoring network.
      x-status: pending
      x-ticket: QS-130
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register an organization and its owner
      description: Creates the organization, the user (scrypt password hash) and an owner membership in one transaction. To prevent account enumeration the response is identical (202, same body, no cookies) whether or not the email is already registered; the password is hashed on both paths and duplicates are audited as `auth.register_duplicate`. The client signs in afterwards. Rate limited per client IP (`REGISTER_IP_RATE_LIMIT_MAX` per hour). Email-verified signup through the local outbox is planned (QS-140).
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Accepted. Same response for new and already-registered emails.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, message]
                        properties:
                          status:
                            type: string
                            const: accepted
                          message:
                            type: string
                            example: If this email address can be used, your workspace is ready. Sign in to continue.
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: >-
        Verifies the password, creates a session row (only an HMAC-SHA256 of the token is stored) and sets `qs_session` and `qs_csrf`. Throttled three ways, each attempt reserved before any await: per normalised client IP (`LOGIN_IP_RATE_LIMIT_MAX` per 15 minutes; IPv6 collapsed to /64), distinct emails per IP (`LOGIN_EMAILS_PER_IP_MAX` per 15 minutes), and per email with progressive backoff (`LOGIN_EMAIL_FREE_ATTEMPTS` free attempts, then 30 s doubling to 15 minutes). 429 responses carry `Retry-After`.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionSetCookie'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Deletes the session row and clears `qs_session` and `qs_csrf`.
      x-status: implemented
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user, organization, role and CSRF token
      x-status: implemented
      responses:
        '200':
          description: Current session context
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset
      description: Writes a reset message to the local outbox. Always returns 202 so the response does not reveal whether the email exists.
      x-status: pending
      x-ticket: QS-015
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Set a new password with a reset token
      description: Consumes the single-use token, replaces the password hash and revokes every existing session of the user.
      x-status: pending
      x-ticket: QS-015
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the current user's active sessions
      x-status: pending
      x-ticket: QS-016
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the current user's sessions
      description: Deletes the session row; open WebSockets authenticated by it are closed (with QS-056).
      x-status: pending
      x-ticket: QS-016
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents in the current organization
      description: >-
        Requires `document:read`. Results are scoped to the session's organization and ordered by `updatedAt` descending. Archived documents are excluded. The implemented slice supports `limit` only and returns `meta: {count, limit}`; keyset `cursor` pagination arrives with the pending list endpoints.
      x-status: implemented
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create an empty document
      description: Requires `document:create` (owner, editor). Writes an audit_log entry.
      x-status: implemented
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/documents/import:
    post:
      operationId: importDocument
      tags: [import-export]
      summary: Import a Markdown file as a new document
      description: Converts Markdown into CRDT insert runs authored by a server replica and persists them as the document's first op-log batch.
      x-status: pending
      x-ticket: QS-112
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document metadata and materialized text
      description: Requires `document:read`. Returns metadata plus the current text (rehydrated from document_ops), the server state vector and the total op count.
      x-status: implemented
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Rename, move, archive or restore a document
      x-status: pending
      x-ticket: QS-091
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Move a document to trash, or delete it permanently
      x-status: pending
      x-ticket: QS-091
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: permanent
          in: query
          required: false
          description: When true, deletes the document and its op log instead of moving it to trash. Requires `document:manage`.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/documents/{id}/presence:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocumentPresence
      tags: [collaboration]
      summary: List peers currently connected to the document's room
      description: Reads the in-memory room on this process. Returns an empty list when no room is loaded.
      x-status: implemented
      responses:
        '200':
          description: Connected peers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PresencePeer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/documents/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: syncDocument
      tags: [collaboration]
      summary: WebSocket sync endpoint (upgrade)
      description: |
        Upgrades to a WebSocket carrying JSON text frames validated with the shared zod
        schemas. The upgrade requires a valid `qs_session` cookie and an `Origin`
        header exactly equal to `APP_ORIGIN`; otherwise the upgrade is refused with 401
        or 403 before any frame is exchanged. Frames larger than `WS_MAX_MESSAGE_BYTES`
        (default 262144) close the socket with code 1009.

        The client must send `hello` first. The server answers `welcome` with the ops
        the client is missing (delta against the client's state vector) and the
        current peers. Every run in an `ops` frame must carry the `clientId` declared
        in `hello`; runs with a foreign client id are rejected (`error` CLIENT_MISMATCH). `hello` may be sent only once; binary frames are rejected with BAD_MESSAGE. A document in another organization answers 404.
        Viewers and commenters may receive but not send `ops`.

        Message schemas: `ClientMessage` and `ServerMessage` (discriminated by `type`);
        see also `x-websocket-messages` below and docs/api/README.md.
      x-status: implemented
      parameters:
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            const: Upgrade
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
        - name: Origin
          in: header
          required: true
          description: Must equal the configured APP_ORIGIN (cross-site WebSocket hijacking defence).
          schema:
            type: string
            format: uri
        - name: Sec-WebSocket-Key
          in: header
          required: true
          schema:
            type: string
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            const: '13'
      responses:
        '101':
          description: Switching Protocols — the connection now carries `ClientMessage` / `ServerMessage` JSON frames.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin mismatch or no `document:read` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          description: Plain HTTP request without upgrade headers
      x-websocket-messages:
        encoding: JSON text frames (binary frames for op batches pending QS-055)
        maxMessageBytes: 262144
        clientToServer:
          hello:
            $ref: '#/components/schemas/HelloMessage'
          ops:
            $ref: '#/components/schemas/ClientOpsMessage'
          presence:
            $ref: '#/components/schemas/ClientPresenceMessage'
          ping:
            $ref: '#/components/schemas/PingMessage'
        serverToClient:
          welcome:
            $ref: '#/components/schemas/WelcomeMessage'
          ops:
            $ref: '#/components/schemas/ServerOpsMessage'
          ack:
            $ref: '#/components/schemas/AckMessage'
          presence:
            $ref: '#/components/schemas/ServerPresenceMessage'
          peer-left:
            $ref: '#/components/schemas/PeerLeftMessage'
          error:
            $ref: '#/components/schemas/WsErrorMessage'
          pong:
            $ref: '#/components/schemas/PongMessage'

  /api/v1/documents/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocumentPermissions
      tags: [sharing]
      summary: List explicit and inherited permissions on a document
      x-status: pending
      x-ticket: QS-092
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocumentPermission'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: replaceDocumentPermissions
      tags: [sharing]
      summary: Replace the explicit permission grants on a document
      description: Requires `document:manage`. Downgrades take effect on live sockets with QS-056.
      x-status: pending
      x-ticket: QS-092
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePermissionsRequest'
      responses:
        '200':
          description: Permissions replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocumentPermission'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/documents/{id}/share-links:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: createShareLink
      tags: [sharing]
      summary: Create a share link with a role and optional expiry
      description: The raw token is returned once; only its hash is stored.
      x-status: pending
      x-ticket: QS-093
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShareLink'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/share-links/{shareLinkId}:
    delete:
      operationId: revokeShareLink
      tags: [sharing]
      summary: Revoke a share link
      x-status: pending
      x-ticket: QS-093
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ShareLinkId'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/documents/{id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: createSnapshot
      tags: [versions]
      summary: Force a snapshot of the document's CRDT state
      description: Normally snapshots are taken periodically by the server; this endpoint forces one (owners only). Snapshots enable op-log compaction (QS-061).
      x-status: pending
      x-ticket: QS-060
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '201':
          description: Snapshot written
          content:
            application/json:
              schema:
                allOf:

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qs_session
      description: Opaque random 32-byte token (base64url). HttpOnly, SameSite=Lax, Secure when NODE_ENV=production. Server stores only an HMAC-SHA256 of it. Lifetime SESSION_TTL_HOURS (default 168).
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Must equal the `qs_csrf` cookie value (also returned as `csrfToken` by GET /api/v1/auth/me). Required on POST/PUT/PATCH/DELETE when a session cookie is present.

  headers:
    SessionSetCookie:
      description: Sets `qs_session` (HttpOnly) and `qs_csrf` (readable by script for the double-submit header).
      schema:
        type: string

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `meta.nextCursor` of the previous page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareLinkId:
      name: shareLinkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      description: Id of a comment; for replies and resolve, the thread's root comment id.
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128

  responses:
    ValidationError:
      description: Request failed schema validation (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Request body is invalid
              details:
                issues:
                  - path: [title]
                    message: String must contain at most 200 character(s)
    Unauthenticated:
      description: Missing, expired or unknown session (UNAUTHENTICATED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: UNAUTHENTICATED
              message: Sign in required
    CsrfInvalid:
      description: Missing or mismatched x-csrf-token (CSRF_INVALID)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: CSRF_INVALID
              message: CSRF token missing or invalid
    Forbidden:
      description: Authenticated but lacking the permission, or CSRF_INVALID on a mutating request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: FORBIDDEN
              message: Missing permission document:edit
    NotFound:
      description: Resource does not exist in the caller's organization (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State conflict, e.g. email already registered (CONFLICT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many attempts (RATE_LIMITED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected server error (INTERNAL); details are logged, not returned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Planned endpoint not built yet (NOT_IMPLEMENTED); `error.details.ticket` names the backlog ticket
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: This endpoint is planned but not implemented yet
              details:
                ticket: QS-090

  schemas:
    # ---------- envelope & errors ----------
    Envelope:
      type: object
      description: Every JSON response. Exactly one of `data` / `error` is non-null.
      required: [data, error]
      properties:
        data:
          description: Payload; null on error.
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [meta]
    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable, safe to show to end users.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (validation issues, `ticket` for 501).
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - CSRF_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - NOT_IMPLEMENTED
        - INTERNAL
    PageMeta:
      type: object
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page; null on the last page.
        limit:
          type: integer
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
        uptimeSeconds:
          type: number
    ReadinessStatus:
      type: object
      required: [status, database, migrations]
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [up]
        migrations:
          type: integer
          description: Number of applied migrations.

    # ---------- identity ----------
    Role:
      type: string
      enum: [owner, editor, commenter, viewer]
    Permission:
      type: string
      enum:
        - document:read
        - document:create
        - document:edit
        - document:comment
        - document:manage
        - member:manage
        - audit:read
        - workspace:manage
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Stored lower-case.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        createdAt:
          type: string
          format: date-time
    Organization:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 60
        createdAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [user, organization, role, permissions, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        csrfToken:
          type: string
          description: Same value as the `qs_csrf` cookie; send as `x-csrf-token`.
    RegisterRequest:
      type: object
      required: [organizationName, displayName, email, password]
      additionalProperties: false
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 120
          description: The slug is derived from the name plus a random suffix.
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 200
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 200
    Session:
      type: object
      required: [id, createdAt, expiresAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        ip:
          type: [string, 'null']
        browser:
          type: [string, 'null']
          description: Shortened User-Agent header captured at login.
        current:
          type: boolean
          description: True for the session making this request.
    Member:
      type: object
      required: [user, role, joinedAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
    Invitation:
      type: object
      required: [id, email, role, invitedBy, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        invitedBy:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    AcceptInvitationRequest:
      type: object
      description: Required fields only when the invitee has no account yet.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 10
          maxLength: 200
    AuditEvent:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: string
          description: bigserial, serialized as a string
        actorUserId:
          type: [string, 'null']
          format: uuid
        action:
          type: string
          examples: [auth.login, document.create]
        targetType:
          type: [string, 'null']
        targetId:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        requestId:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    # ---------- documents ----------
    Document:
      type: object
      required: [id, organizationId, title, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        folderId:
          type: [string, 'null']
          format: uuid
          description: Present once folders land (QS-090).
        title:
          type: string
          minLength: 1
          maxLength: 200
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time
    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          required: [text, vector, opCount]
          properties:
            text:
              type: string
              description: Materialized visible text (tombstones removed).
            vector:
              $ref: '#/components/schemas/StateVector'
            opCount:
              type: integer
              minimum: 0
              description: Total individual ops (characters inserted + deleted) in the op log.
    CreateDocumentRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    UpdateDocumentRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        folderId:
          type: [string, 'null']
          format: uuid
        archived:
          type: boolean
    ImportRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: text/markdown
          description: Markdown file, at most 1 MiB.
        title:
          type: string
          maxLength: 200
        folderId:
          type: string
          format: uuid

    # ---------- folders & sharing ----------
    Folder:
      type: object
      required: [id, organizationId, name, parentId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        parentId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        parentId:
          type: [string, 'null']
          format: uuid
    UpdateFolderRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        parentId:
          type: [string, 'null']
          format: uuid
    DocumentPermission:
      type: object
      required: [userId, role, source]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        source:
          type: string
          enum: [organization, folder, document]
          description: Where the effective grant comes from.
        folderId:
          type: [string, 'null']
          format: uuid
    ReplacePermissionsRequest:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 500
          items:
            type: object
            required: [userId, role]
            properties:
              userId:
                type: string
                format: uuid
              role:
                $ref: '#/components/schemas/Role'
    ShareLink:
      type: object
      required: [id, documentId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        role:
          type: string
          enum: [viewer, commenter, editor]
        url:
          type: string
          format: uri
          description: Contains the raw token; returned only by the create call.
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateShareLinkRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [viewer, commenter, editor]
        expiresAt:
          type: [string, 'null']
          format: date-time

    # ---------- versions ----------
    Snapshot:
      type: object
      required: [id, documentId, vector, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        vector:
          $ref: '#/components/schemas/StateVector'
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
    Version:
      type: object
      required: [id, documentId, kind, vector, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [automatic, named]
        name:
          type: [string, 'null']
          maxLength: 120
        vector:
          $ref: '#/components/schemas/StateVector'
          description: State vector the version captures.
        createdBy:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    VersionDetail:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required: [text, diff]
          properties:
            text:
              type: string
            diff:
              type: array
              items:
                type: object
                required: [op, text]
                properties:
                  op:
                    type: string
                    enum: [equal, insert, delete]
                  text:
                    type: string
    CreateVersionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    # ---------- comments & notifications ----------
    CommentAnchor:
      type: object
      description: A CRDT position = the item id of the character to the left of the position (null fields = document start). Stays valid when that character is deleted (tombstone).
      required: [itemClient, itemSeq]
      properties:
        itemClient:
          type: [string, 'null']
        itemSeq:
          type: [integer, 'null']
          minimum: 1
    CommentRange:
      type: object
      required: [start, end]
      properties:
        start:
          $ref: '#/components/schemas/CommentAnchor'
        end:
          $ref: '#/components/schemas/CommentAnchor'
    Comment:
      type: object
      required: [id, threadId, authorUserId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 10000
        mentions:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, 'null']
          format: date-time
    CommentThread:
      type: object
      required: [id, documentId, range, status, comments, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        range:
          $ref: '#/components/schemas/CommentRange'
        quotedText:
          type: string
          description: Text covered by the range when the thread was created.
        status:
          type: string
          enum: [open, resolved]
        resolvedBy:
          type: [string, 'null']
          format: uuid
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        createdAt:
          type: string
          format: date-time
    CommentBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    CreateCommentThreadRequest:
      type: object
      required: [range, body]
      properties:
        range:
          $ref: '#/components/schemas/CommentRange'
        body:
          type: string
          minLength: 1
          maxLength: 10000
    ResolveCommentRequest:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: boolean
    Notification:
      type: object
      required: [id, kind, createdAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [mention, comment_reply, invitation, share]
        documentId:
          type: [string, 'null']
          format: uuid
        commentId:
          type: [string, 'null']
          format: uuid
        actorUserId:
          type: [string, 'null']
          format: uuid
        summary:
          type: string
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    SearchResult:
      type: object
      required: [documentId, title, rank, snippet]
      properties:
        documentId:
          type: string
          format: uuid
        title:
          type: string
        rank:
          type: number
        snippet:
          type: string
          description: Excerpt with matches wrapped in `<mark>`; all other HTML is escaped.
        updatedAt:
          type: string
          format: date-time

    # ---------- CRDT & sync protocol ----------
    ClientId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      description: Random replica id chosen per editor tab.
    ItemId:
      type: object
      required: [client, seq]
      properties:
        client:
          $ref: '#/components/schemas/ClientId'
        seq:
          type: integer
          minimum: 1
          description: Contiguous per client (1, 2, 3, ...).
    StateVector:
      type: object
      description: Map clientId -> highest contiguous seq integrated.
      additionalProperties:
        type: integer
        minimum: 0
      examples:
        - { k3f9a1: 42, p0x7qz: 7 }
    Anchor:
      description: CRDT position (item id of the character to the left, null = document start).
      oneOf:
        - $ref: '#/components/schemas/ItemId'
        - type: 'null'
    InsertRun:
      type: object
      description: Consecutive inserts by one client with consecutive seq and lamport, where each character's origin is the previous character. Character i has id {client, seq+i}, lamport lamport+i.
      required: [k, client, seq, lamport, origin, text]
      additionalProperties: false
      properties:
        k:
          type: string
          const: i
        client:
          $ref: '#/components/schemas/ClientId'
        seq:
          type: integer
          minimum: 1
        lamport:
          type: integer
          minimum: 1
        origin:
          description: Origin of the first character (nearest visible item to the left at creation time); null = document start.
          oneOf:
            - $ref: '#/components/schemas/ItemId'
            - type: 'null'
        text:
          type: string
          minLength: 1
    DeleteTarget:
      type: object
      description: Range of item ids {client, seq} .. {client, seq+len-1} to tombstone.
      required: [client, seq, len]
      additionalProperties: false
      properties:
        client:
          $ref: '#/components/schemas/ClientId'
        seq:
          type: integer
          minimum: 1
        len:
          type: integer
          minimum: 1
    DeleteRun:
      type: object
      description: Consecutive delete ops by one client; op j has id {client, seq+j}, lamport lamport+j.
      required: [k, client, seq, lamport, targets]
      additionalProperties: false
      properties:
        k:
          type: string
          const: d
        client:
          $ref: '#/components/schemas/ClientId'
        seq:
          type: integer
          minimum: 1
        lamport:
          type: integer
          minimum: 1
        targets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeleteTarget'
    Run:
      oneOf:
        - $ref: '#/components/schemas/InsertRun'
        - $ref: '#/components/schemas/DeleteRun'
      discriminator:
        propertyName: k
        mapping:
          i: '#/components/schemas/InsertRun'
          d: '#/components/schemas/DeleteRun'
    PresencePeer:
      type: object
      required: [clientId, userId, displayName, color, anchor, focused]
      properties:
        clientId:
          $ref: '#/components/schemas/ClientId'
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Deterministic colour derived from clientId.
        anchor:
          $ref: '#/components/schemas/Anchor'
        focused:
          type: boolean
          description: Whether the peer's editor currently has focus.

    HelloMessage:
      type: object
      required: [type, clientId, vector]
      additionalProperties: false
      description: The display name comes from the session, not the frame.
      properties:
        type:
          type: string
          const: hello
        clientId:
          $ref: '#/components/schemas/ClientId'
        vector:
          $ref: '#/components/schemas/StateVector'
    ClientOpsMessage:
      type: object
      required: [type, runs]
      additionalProperties: false
      properties:
        type:
          type: string
          const: ops
        runs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Run'
    ClientPresenceMessage:
      type: object
      required: [type, anchor, focused]
      additionalProperties: false
      properties:
        type:
          type: string
          const: presence
        anchor:
          $ref: '#/components/schemas/Anchor'
        focused:
          type: boolean
    PingMessage:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: ping
    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/HelloMessage'
        - $ref: '#/components/schemas/ClientOpsMessage'
        - $ref: '#/components/schemas/ClientPresenceMessage'
        - $ref: '#/components/schemas/PingMessage'
      discriminator:
        propertyName: type
        mapping:
          hello: '#/components/schemas/HelloMessage'
          ops: '#/components/schemas/ClientOpsMessage'
          presence: '#/components/schemas/ClientPresenceMessage'
          ping: '#/components/schemas/PingMessage'

    WelcomeMessage:
      type: object
      required: [type, vector, runs, peers, canEdit]
      properties:
        type:
          type: string
          const: welcome
        canEdit:
          type: boolean
          description: False for viewers and commenters, whose ops frames are rejected with FORBIDDEN.
        vector:
          $ref: '#/components/schemas/StateVector'
        runs:
          type: array
          description: Ops the server has that the hello vector does not cover.
          items:
            $ref: '#/components/schemas/Run'
        peers:
          type: array
          items:
            $ref: '#/components/schemas/PresencePeer'
    ServerOpsMessage:
      type: object
      required: [type, runs, from]
      properties:
        type:
          type: string
          const: ops
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        from:
          $ref: '#/components/schemas/ClientId'
    AckMessage:
      type: object
      required: [type, vector]
      properties:
        type:
          type: string
          const: ack
        vector:
          $ref: '#/components/schemas/StateVector'
          description: Server state vector after integrating and persisting the client's batch.
    ServerPresenceMessage:
      type: object
      required: [type, peer]
      properties:
        type:
          type: string
          const: presence
        peer:
          $ref: '#/components/schemas/PresencePeer'
    PeerLeftMessage:
      type: object
      required: [type, clientId]
      properties:
        type:
          type: string
          const: peer-left
        clientId:
          $ref: '#/components/schemas/ClientId'
    WsErrorMessage:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          const: error
        code:
          type: string
          enum:
            [
              BAD_MESSAGE,
              NOT_READY,
              FORBIDDEN,
              INVALID_OP,
              CAUSALITY_VIOLATION,
              CLIENT_MISMATCH,
              INTERNAL,
            ]
        message:
          type: string
    PongMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: pong
    ServerMessage:
      oneOf:
        - $ref: '#/components/schemas/WelcomeMessage'
        - $ref: '#/components/schemas/ServerOpsMessage'
        - $ref: '#/components/schemas/AckMessage'
        - $ref: '#/components/schemas/ServerPresenceMessage'
        - $ref: '#/components/schemas/PeerLeftMessage'
        - $ref: '#/components/schemas/WsErrorMessage'
        - $ref: '#/components/schemas/PongMessage'
      discriminator:
        propertyName: type
        mapping:
          welcome: '#/components/schemas/WelcomeMessage'
          ops: '#/components/schemas/ServerOpsMessage'
          ack: '#/components/schemas/AckMessage'
          presence: '#/components/schemas/ServerPresenceMessage'
          peer-left: '#/components/schemas/PeerLeftMessage'
          error: '#/components/schemas/WsErrorMessage'
          pong: '#/components/schemas/PongMessage'
